[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octopus-mcp"
version = "0.1.0"
description = "MCP server for Octopus Energy account analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Daniel Chicot" }]
keywords = ["mcp", "octopus-energy", "claude"]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer; server.py imports mcp.server.fastmcp.
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "keyring>=25",
    "platformdirs>=4",
    "tenacity>=8",
    # Windows ships no IANA tz database; ZoneInfo("Europe/London") needs this there.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-recording>=0.13",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
octopus-mcp = "octopus_mcp.cli:main"

[project.urls]
Repository = "https://github.com/DanielChicot/octopus-mcp"
Issues = "https://github.com/DanielChicot/octopus-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/octopus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit the real Octopus API (gated on OCTOPUS_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*", "tenacity.*"]
ignore_missing_imports = true
